name: Validate blog

on:
  push:
    branches: [dev_tttt]
  pull_request:
    branches: [dev_tttt]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        # GHSA-vfj7-8cjw-p6xm (braces): 影响 braces 所有已发布版本,上游无修复版;
        # 漏洞仅在接受不可信 glob 模式时可利用,静态博客构建场景无攻击面。
        # micromatch@4 固定依赖 braces@^3,overrides 会破坏语义,
        # 传染链 micromatch/hexo/hexo-generator-sitemap 一并豁免。
        # braces 发布修复版后应立即移除本豁免。
        run: |
          npm audit --audit-level=high --json > /tmp/audit.json || true
          node -e '
            const a = JSON.parse(require("fs").readFileSync("/tmp/audit.json", "utf8"));
            const vulns = a.vulnerabilities || {};
            const exempt = new Set(["braces", "micromatch", "hexo", "hexo-generator-sitemap"]);
            const nonExempt = Object.entries(vulns).filter(([name, v]) =>
              (v.severity === "high" || v.severity === "critical") && !exempt.has(name));
            if (nonExempt.length) {
              console.error("High/critical vulnerabilities beyond the braces-exemption set:");
              for (const [name, v] of nonExempt) console.error(`  ${name}: ${v.via.map(x => x.title || x).join("; ")}`);
              process.exit(1);
            }
            console.log("Audit OK: no high/critical outside the documented braces exemption.");
          '
      - name: Validate both themes
        run: npm run verify
